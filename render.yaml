services:
  # 1. Define the Node.js Backend Service
  - type: web
    name: backend-service
    env: node
    plan: free 
    # Points Render to the root of the repository where package.json sits
    rootDir: . 
    buildCommand: npm install
    # Invokes the specific script we just mapped out above
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
        # FIX: Force Render's internal reverse proxy to routing channel 5000
      - key: PORT
        value: 5000
      # Connects the database to the backend using Render's secure internal network
      - key: DATABASE_URL
        fromDatabase:
          name: my-monorepo-db
          property: connectionString

# 2. Define the PostgreSQL Database Instance
databases:
  - name: my-monorepo-db
    plan: free
