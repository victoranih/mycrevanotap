services:
  # 1. Define the Node.js Backend Service
  - type: web
    name: backend-service
    env: node
    plan: free 
    # FIX: Remove 'server' and use '.' to point to the root directory
    rootDir: . 
    buildCommand: npm install
    # FIX: Tell node explicitly to run your server file from the root folder
    startCommand: node server/index.js 
    envVars:
      - key: NODE_ENV
        value: production
      # Connects the database to the backend using Render's secure internal network
      - key: DATABASE_URL
        fromDatabase:
          name: my-monorepo-db
          property: connectionString

# 2. Define the PostgreSQL Database Instance
databases:
  - name: my-monorepo-db
    plan: free
