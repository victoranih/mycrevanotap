services:
  - type: web
    name: my-web-app
    runtime: node # Change to python, go, ruby, docker, etc. depending on your tech stack
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: my-database
          property: connectionString
   plan: free          

databases:
  - name: my-database
    plan: free # Options: free, starter, standard, etc.
